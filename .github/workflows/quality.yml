name: Quality checks
on:
  push:
    paths-ignore:
      - 'visual/**'
      - 'playwright.visual.config.ts'
      - '.github/workflows/visual.yml'
      - '.github/workflows/quality.yml'
      - '*.md'
      - 'validation/**'
      - '.gitignore'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start production preview
        run: |
          npm run preview > /tmp/kurio-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:4173 > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/kurio-preview.log
          exit 1
      - run: npm run audit -- http://localhost:4173
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: validation/lighthouse
          retention-days: 14
