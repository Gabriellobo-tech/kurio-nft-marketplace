name: Restore original visual baseline
on:
  push:
    branches: [perf/native-password-initialization]
    paths: [.github/workflows/restore-visual-baseline.yml]
permissions:
  contents: write
  actions: read
jobs:
  restore-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/native-password-initialization
      - name: Download reviewed original screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41632072257 --repo Gabriellobo-tech/kurio-nft-marketplace --name visual-review --dir /tmp/original-visual
      - name: Restore and validate exact PNG bytes
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, struct, zlib
          source = pathlib.Path('/tmp/original-visual/visual/baselines/desktop/home.png')
          data = source.read_bytes()
          assert len(data) == 1659908
          assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == '3fe6e54c561f90bc9cf7ec16b8a246e3a9b0cac6'
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          offset = 8
          while offset < len(data):
              length = struct.unpack('>I', data[offset:offset+4])[0]
              chunk = data[offset+4:offset+8+length]
              crc = struct.unpack('>I', data[offset+8+length:offset+12+length])[0]
              assert zlib.crc32(chunk) & 0xffffffff == crc
              offset += length + 12
              if chunk[:4] == b'IEND':
                  break
          assert offset == len(data)
          pathlib.Path('visual/baselines/desktop/home.png').write_bytes(data)
          print('Restored original PNG; size, Git SHA and all PNG chunk checksums verified.')
          PY
      - name: Commit restored baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visual/baselines/desktop/home.png
          if ! git diff --cached --quiet; then
            git commit -m "Restore intact desktop home baseline from reviewed artifact"
            git push origin HEAD:perf/native-password-initialization
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.visual.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restored-visual-verification
          path: |
            visual-report
            test-results
          retention-days: 14
